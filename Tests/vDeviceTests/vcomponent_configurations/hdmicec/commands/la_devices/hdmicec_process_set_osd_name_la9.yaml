HdmiCec:
  command: cec_message
  description: Trigger process(SetOSDName) from SONY (LA=9) - name "SONY"
  message:
    user_defined: true
    # Header 0x9F: initiator=9, destination=0xF (broadcast)
    # Opcode 0x47: SetOSDName  "SONY" = 0x53 0x4F 0x4E 0x59
    payload: ["0x9F", "0x47", "0x53", "0x4F", "0x4E", "0x59"]
